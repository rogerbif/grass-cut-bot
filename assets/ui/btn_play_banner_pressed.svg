  <!-- ================= 2. 3D BASE / LOWER BEVEL (COMPRESSED/SUNKEN INNER BODY) ================= -->
  <!-- Base 3D comprimida sem pontas no lado esquerdo -->
  <path d="M 24 117 L 18 122 Q 22 127 30 127 L 384 127 Q 394 127 402 121 L 421 84 Q 424 78 420 72 L 416 72 L 398 117 Q 394 120 388 120 L 24 120 Z"
        fill="url(#base_3d_grad_pressed)" stroke="#114b0e" stroke-width="1.5" stroke-linejoin="round" />

  <!-- ================= 3. MAIN BUTTON FACE (SUNKEN INNER BODY - SHIFTED DOWN BY 7PX) ================= -->
  <path d="M 72 37 
           L 396 37 
           Q 403 37 407 42 
           L 419 66 
           Q 422 70 418 74 
           L 399 112 
           Q 396 117 388 117 
           L 24 117 
           Q 16 117 18 109 
           L 60 44 
           Q 63 37 72 37 Z"
        fill="url(#main_face_grad_pressed)"
        stroke="#5d9600"
        stroke-width="2.5"
        stroke-linejoin="round" />

  <!-- ================= 4. GLOSS & HIGHLIGHTS ================= -->
  <path d="M 74 39 
           L 394 39 
           Q 400 39 403 43 
           L 410 55 
           L 398 57 
           L 390 48 
           L 76 48 
           L 66 61 
           L 61 59 Q 66 39 74 39 Z"
