  <path d="M 374 18 L 402 18 Q 408 18 414 23 L 436 53 Q 441 60 436 68 L 424 94 Q 418 108 410 118"
        fill="none" stroke="#00f5a8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Bottom-Left Detached Cyber Bracket (EXACTLY IDENTICAL TO NORMAL STATE) -->
  <path d="M 24 92 L 34 92 L 15 125 Q 12 135 20 135 L 62 135 L 62 143 L 18 143 Q 6 143 5 130 L 14 110 Z"
        fill="#0b2834" />
  <path d="M 24 96 L 11 126 Q 8 136 18 136 L 58 136"
