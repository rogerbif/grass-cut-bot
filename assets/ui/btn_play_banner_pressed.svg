<svg xmlns="http://www.w3.org/2000/svg" width="450" height="138" viewBox="0 10 450 138">
  <defs>
    <!-- Pressed Gradients -->
    <linearGradient id="main_face_grad_pressed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eaf308" />
      <stop offset="25%" stop-color="#daf005" />
      <stop offset="65%" stop-color="#bfed02" />
      <stop offset="100%" stop-color="#94dc00" />
    </linearGradient>

    <linearGradient id="base_3d_grad_pressed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a8e16" />
      <stop offset="100%" stop-color="#14580f" />
    </linearGradient>

    <linearGradient id="top_gloss_grad_pressed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <radialGradient id="center_glint_pressed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#fffb88" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffea00" stop-opacity="0.0" />
    </radialGradient>
  </defs>

  <!-- ================= 1. CYBER TECH ACCENTS (100% STATIC FRAME - ZERO MOVEMENT) ================= -->
  <!-- Top-Right Dark Bracket Plate (EXACTLY IDENTICAL TO NORMAL STATE) -->
  <path d="M 220 18 L 402 18 Q 408 18 414 23 L 436 53 Q 441 60 436 68 L 424 94 Q 418 108 410 118 Q 405 124 396 124 L 388 124 L 404 104 Q 412 88 418 72 Q 420 66 416 62 L 398 33 Q 394 26 386 26 L 220 26 Z"
        fill="#0b2834" />

