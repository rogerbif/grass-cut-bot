    <ellipse cx="7" cy="18" rx="6" ry="10.5" transform="rotate(28 7 18)" fill="url(#goldGrain)" stroke="#6B3F06" stroke-width="1"/>
    <ellipse cx="-7" cy="6" rx="6" ry="10.5" transform="rotate(-28 -7 6)" fill="url(#goldGrain)" stroke="#6B3F06" stroke-width="1"/>
