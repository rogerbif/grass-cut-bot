<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="wheatGlow" cx="50%" cy="52%" r="46%">
      <stop offset="0%" stop-color="#FFCA28" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#0A1428" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGrain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF078"/>
