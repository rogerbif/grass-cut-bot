    <ellipse cx="6" cy="-12" rx="5.5" ry="9.5" transform="rotate(25 6 -12)" fill="url(#goldGrain)" stroke="#6B3F06" stroke-width="1"/>
    <ellipse cx="0" cy="-24" rx="5.5" ry="10" fill="url(#goldGrain)" stroke="#6B3F06" stroke-width="1"/>
  </g>

