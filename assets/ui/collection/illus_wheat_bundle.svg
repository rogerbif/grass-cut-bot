    <ellipse cx="-6" cy="-8" rx="5.5" ry="9.5" transform="rotate(-25 -6 -8)" fill="url(#goldGrain)" stroke="#6B3F06" stroke-width="1"/>
    <ellipse cx="6" cy="-10" rx="5.5" ry="9.5" transform="rotate(25 6 -10)" fill="url(#goldGrain)" stroke="#6B3F06" stroke-width="1"/>
