<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="glow" cx="50%" cy="62%" r="46%">
      <stop offset="0%" stop-color="#38F296" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0A1428" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topTurf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#76D82B"/>
      <stop offset="100%" stop-color="#48A516"/>
    </linearGradient>
    <linearGradient id="soilLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5E2F"/>
      <stop offset="100%" stop-color="#5C3B1A"/>
    </linearGradient>
    <linearGradient id="soilRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6B4420"/>
      <stop offset="100%" stop-color="#3E250E"/>
    </linearGradient>
  </defs>
  <!-- Ambient radial glow -->
  <ellipse cx="64" cy="84" rx="52" ry="32" fill="url(#glow)"/>
  <!-- Drop shadow -->
  <polygon points="64,116 14,91 64,68 114,91" fill="#040812" fill-opacity="0.55"/>
  <!-- Soil Left Face -->
  <polygon points="16,84 64,108 64,115 16,91" fill="url(#soilLeft)"/>
  <!-- Soil Right Face -->
  <polygon points="112,84 64,108 64,115 112,91" fill="url(#soilRight)"/>
  <!-- Turf Rim Left -->
  <polygon points="16,79 64,103 64,108 16,84" fill="#5BB91E"/>
  <!-- Turf Rim Right -->
  <polygon points="112,79 64,103 64,108 112,84" fill="#3D8D12"/>
  <!-- Isometric Top Plane -->
  <polygon points="64,56 112,79 64,103 16,79" fill="url(#topTurf)"/>
</svg>
