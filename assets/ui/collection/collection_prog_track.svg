<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 44" width="520" height="44">
  <defs>
    <!-- Gradiente escuro do fundo da calha -->
    <linearGradient id="cyber_track_bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#081426" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050e1c" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Borda neon ciano -->
    <linearGradient id="cyber_border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b4d8"/>
      <stop offset="50%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>

    <!-- Brilho neon -->
    <filter id="neon_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Corpo com extremidades em seta chanfrada cyber (como no topo da referência) -->
  <!-- Esquerda chanfrada apontando para fora, direita chanfrada apontando para fora -->
  <path d="M 22 2
           L 498 2
           L 516 22
           L 498 42
           L 22 42
           L 4 22
           Z"
        fill="url(#cyber_track_bg)"
        stroke="url(#cyber_border)"
        stroke-width="2.0"
        stroke-linejoin="round"
        filter="url(#neon_glow)"/>

  <!-- Linha de detalhe interno superior -->
  <path d="M 24 5 L 496 5"
        stroke="#ffffff"
        stroke-width="1.0"
        opacity="0.25"/>
</svg>
