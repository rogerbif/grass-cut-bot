<svg xmlns="http://www.w3.org/2000/svg" width="640" height="164" viewBox="0 0 640 164">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1830" stop-opacity="0.96"/>
      <stop offset="55%" stop-color="#111936" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1E143C" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2AD4E8" stop-opacity="0.88"/>
      <stop offset="50%" stop-color="#3A7BE0" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#7842E8" stop-opacity="0.88"/>
    </linearGradient>
  </defs>
  <!-- Main Chamfered Horizontal Card Frame -->
  <polygon points="18,3 622,3 637,18 637,146 622,161 18,161 3,146 3,18"
           fill="url(#cardBg)"
           stroke="url(#borderGrad)"
           stroke-width="2.5"/>
  <!-- Subtle Inner Frame Line -->
  <polygon points="21,8 619,8 632,21 632,143 619,156 21,156 8,143 8,21"
           fill="none"
           stroke="#64D8FF"
           stroke-opacity="0.16"
           stroke-width="1"/>
</svg>
