<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 68" width="280" height="68">
  <defs>
    <!-- Gradiente Azul-Marinho Profundo Translúcido (fundo idêntico aos pills ciano) -->
    <linearGradient id="pill_bg_gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2847" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#08162b" stop-opacity="0.97"/>
    </linearGradient>

    <!-- Borda Ouro/Cyber Luminosa -->
    <linearGradient id="pill_border_gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f39c12"/>
      <stop offset="50%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#f9c74f"/>
    </linearGradient>

    <filter id="pill_shadow_gold" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#pill_shadow_gold)">
    <!-- Aba Superior Central/Direita com Listras Cyber em Dourado -->
    <polygon points="132,12 140,4 200,4 208,12" fill="#ffd166"/>
    <!-- Listras Diagonais Escuras na Aba -->
    <line x1="172" y1="12" x2="178" y2="4" stroke="#08162b" stroke-width="2.2"/>
    <line x1="179" y1="12" x2="185" y2="4" stroke="#08162b" stroke-width="2.2"/>
    <line x1="186" y1="12" x2="192" y2="4" stroke="#08162b" stroke-width="2.2"/>
    <line x1="193" y1="12" x2="199" y2="4" stroke="#08162b" stroke-width="2.2"/>

    <!-- Corpo Octogonal Chanfrado Simétrico -->
    <polygon points="18,12 262,12 274,24 274,48 262,60 18,60 6,48 6,24"
             fill="url(#pill_bg_gold)"
             stroke="url(#pill_border_gold)"
             stroke-width="2.4"
             stroke-linejoin="round"/>

    <!-- Linha de Brilho Superior Interna -->
    <line x1="20" y1="15" x2="260" y2="15" stroke="#ffffff" stroke-width="1.2" opacity="0.25"/>
  </g>
</svg>
