<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 84" width="300" height="84">
  <defs>
    <!-- Gradiente Azul-Violeta Escuro Profundo (fiel à referência do botão REPETIR) -->
    <linearGradient id="rep_bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#192852" stop-opacity="0.96"/>
      <stop offset="55%" stop-color="#121d3e" stop-opacity="0.97"/>
      <stop offset="100%" stop-color="#0b1228" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="rep_border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7b2cbf"/>
      <stop offset="50%" stop-color="#9d4edd"/>
      <stop offset="100%" stop-color="#5a189a"/>
    </linearGradient>

    <filter id="rep_shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#rep_shadow)">
    <!-- Base Extrudada Inferior -->
    <polygon points="22,16 278,16 292,30 292,62 278,76 22,76 8,62 8,30"
             fill="#080b1c"/>

    <!-- Placa Principal Octogonal Chanfrada -->
    <polygon points="22,10 278,10 292,24 292,56 278,70 22,70 8,56 8,24"
             fill="url(#rep_bg)"
             stroke="url(#rep_border)"
             stroke-width="2.6"
             stroke-linejoin="round"/>

    <!-- Traço Brilhante Superior Esquerdo -->
    <line x1="28" y1="10" x2="72" y2="10" stroke="#c77dff" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Brilho Interno Sutil -->
    <line x1="24" y1="14" x2="276" y2="14" stroke="#ffffff" stroke-width="1.2" opacity="0.22"/>
  </g>
</svg>
