<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- Topo do Cronômetro -->
  <rect x="18" y="2" width="12" height="4" rx="2" fill="#8ecae6"/>
  <rect x="22" y="5" width="4" height="4" fill="#8ecae6"/>
  <!-- Botão Lateral Direito do Cronômetro -->
  <path d="M 36 9 L 40 13" stroke="#8ecae6" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Aro do Relógio -->
  <circle cx="24" cy="26" r="17" stroke="#a8dadc" stroke-width="3.5" fill="#0d2644" fill-opacity="0.6"/>

  <!-- Marcações Internas -->
  <line x1="24" y1="12" x2="24" y2="15" stroke="#8ecae6" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="24" y1="37" x2="24" y2="40" stroke="#8ecae6" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="10" y1="26" x2="13" y2="26" stroke="#8ecae6" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="35" y1="26" x2="38" y2="26" stroke="#8ecae6" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Ponteiros -->
  <polyline points="24,17 24,26 30,30" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="24" cy="26" r="2.5" fill="#00f5d4"/>
</svg>
