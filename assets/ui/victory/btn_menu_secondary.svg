<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 72" width="280" height="72">
  <defs>
    <!-- Gradiente azul ciano mecha (estilo Mapa/Menu) -->
    <linearGradient id="btn_menu_bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00b4d8"/>
      <stop offset="60%" stop-color="#0077b6"/>
      <stop offset="100%" stop-color="#023e8a"/>
    </linearGradient>

    <linearGradient id="btn_menu_border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#90e0ef"/>
      <stop offset="50%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>

    <!-- Base 3D extrudada -->
    <linearGradient id="btn_menu_base" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#023e8a"/>
      <stop offset="100%" stop-color="#03045e"/>
    </linearGradient>
  </defs>

  <!-- Camada Base 3D Inferior -->
  <path d="M 22 18 L 258 18 L 272 32 L 272 58 L 258 68 L 22 68 L 8 58 L 8 32 Z"
        fill="url(#btn_menu_base)"/>

  <!-- Placa Superior do Botão -->
  <path d="M 22 10 L 258 10 L 272 24 L 272 48 L 258 60 L 22 60 L 8 48 L 8 24 Z"
        fill="url(#btn_menu_bg)"
        stroke="url(#btn_menu_border)"
        stroke-width="2.5"
        stroke-linejoin="round"/>

  <!-- Brilho no topo -->
  <path d="M 24 13 L 256 13"
        stroke="#ffffff"
        stroke-width="1.8"
        opacity="0.5"/>
</svg>
