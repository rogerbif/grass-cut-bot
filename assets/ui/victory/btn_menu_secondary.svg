<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 84" width="300" height="84">
  <defs>
    <!-- Gradiente Azul-Marinho Profundo (fiel à referência do botão MENU) -->
    <linearGradient id="menu_bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#11345c" stop-opacity="0.96"/>
      <stop offset="55%" stop-color="#0b2442" stop-opacity="0.97"/>
      <stop offset="100%" stop-color="#07162c" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="menu_border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="50%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#00a8e8"/>
    </linearGradient>

    <filter id="menu_shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#menu_shadow)">
    <!-- Base Extrudada Inferior -->
    <polygon points="22,16 278,16 292,30 292,62 278,76 22,76 8,62 8,30"
             fill="#041022"/>

    <!-- Placa Principal Octogonal Chanfrada -->
    <polygon points="22,10 278,10 292,24 292,56 278,70 22,70 8,56 8,24"
             fill="url(#menu_bg)"
             stroke="url(#menu_border)"
             stroke-width="2.6"
             stroke-linejoin="round"/>

    <!-- Traço Brilhante Superior Esquerdo -->
    <line x1="28" y1="10" x2="72" y2="10" stroke="#80ffdb" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Brilho Interno Sutil -->
    <line x1="24" y1="14" x2="276" y2="14" stroke="#ffffff" stroke-width="1.2" opacity="0.22"/>
  </g>
</svg>
