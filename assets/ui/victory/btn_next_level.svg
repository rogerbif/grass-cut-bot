<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 112" width="620" height="112">
  <defs>
    <!-- Gradiente Neon Esmeralda / Verde-Menta Elétrico (fiel à referência) -->
    <linearGradient id="next_face" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38ff7a"/>
      <stop offset="50%" stop-color="#14e864"/>
      <stop offset="100%" stop-color="#05b84c"/>
    </linearGradient>

    <!-- Base 3D Esmeralda Escura -->
    <linearGradient id="next_base" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047a32"/>
      <stop offset="100%" stop-color="#03471e"/>
    </linearGradient>

    <!-- Borda Luminosa Branca/Verde -->
    <linearGradient id="next_rim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b8ffcf"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#00f5d4"/>
    </linearGradient>

    <filter id="neon_btn_glow" x="-12%" y="-15%" width="124%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#00f59b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ================= 1. MOLDURA E TRAÇOS CYBER EXTERNOS ================= -->
  <!-- Aba Superior Central Verde-Limão -->
  <polygon points="340,14 348,6 410,6 418,14" fill="#38ff7a"/>

  <!-- Colchete Neon Direito -->
  <polyline points="546,12 586,12 608,48 584,96 470,96"
            fill="none"
            stroke="#00f5d4"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
            opacity="0.9"/>
  <!-- Traço Diagonal Externo Direito -->
  <line x1="600" y1="68" x2="588" y2="92" stroke="#00f5d4" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Traços Diagonais Externos Esquerdos -->
  <line x1="22" y1="44" x2="10" y2="70" stroke="#38ff7a" stroke-width="4" stroke-linecap="round"/>
  <polyline points="18,76 34,98 92,98"
            fill="none"
            stroke="#00f5d4"
            stroke-width="2.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            opacity="0.85"/>

  <!-- ================= 2. CORPO 3D E FACE PRINCIPAL ================= -->
  <g filter="url(#neon_btn_glow)">
    <!-- Base 3D Inferior -->
    <polygon points="44,26 574,26 596,58 574,92 44,92 22,58"
             fill="url(#next_base)"
             stroke="#00f5d4"
             stroke-width="1.8"
             stroke-linejoin="round"/>

    <!-- Face Principal Luminosa -->
    <polygon points="44,18 574,18 594,50 574,82 44,82 24,50"
             fill="url(#next_face)"
             stroke="url(#next_rim)"
             stroke-width="3"
             stroke-linejoin="round"/>

    <!-- Reflexo Superior Glassy -->
    <polygon points="48,22 570,22 584,44 34,44"
             fill="#ffffff"
             opacity="0.22"/>
  </g>
</svg>
