<svg xmlns="http://www.w3.org/2000/svg" width="440" height="580" viewBox="0 0 440 580">
  <defs>
    <!-- Gradiente de fundo escuro navy arcade -->
    <linearGradient id="card_bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#091b30" stop-opacity="0.97"/>
      <stop offset="50%" stop-color="#061426" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#040b17" stop-opacity="0.99"/>
    </linearGradient>

    <!-- Gradiente da borda neon (ciano para roxo) -->
    <linearGradient id="card_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2bd9fe"/>
      <stop offset="35%" stop-color="#00e5ff"/>
      <stop offset="70%" stop-color="#5e42d6"/>
      <stop offset="100%" stop-color="#a445f0"/>
    </linearGradient>

    <!-- Gradiente das 3 ranhuras decorativas -->
    <linearGradient id="slashes_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2bd9fe"/>
      <stop offset="100%" stop-color="#00f5ff"/>
    </linearGradient>
  </defs>

  <!-- Placa chanfrada nos 4 cantos -->
  <!-- Top: 28 to 340, chamfer to 412 72, Right down to 436 544, chamfer to 404 576, Left to 36 576, chamfer to 4 544, Left up to 4 36, chamfer to 36 4 -->
  <path d="M 36 4 L 300 4 L 320 20 L 416 20 L 436 40 L 436 544 L 408 576 L 32 576 L 4 548 L 4 36 Z"
        fill="url(#card_bg)" stroke="url(#card_border)" stroke-width="3" stroke-linejoin="round"/>

  <!-- Linha interna de reflexo sutil -->
  <path d="M 40 12 L 296 12" stroke="#8bf0ff" stroke-width="1.5" stroke-opacity="0.4" stroke-linecap="round"/>

  <!-- 3 Ranhuras diagonais decorativas no topo superior direito (estilo cyber da referência) -->
  <polygon points="334,16 348,6 358,6 344,16" fill="url(#slashes_grad)"/>
  <polygon points="364,16 378,6 388,6 374,16" fill="url(#slashes_grad)"/>
  <polygon points="394,16 408,6 418,6 404,16" fill="url(#slashes_grad)"/>
</svg>