<svg xmlns="http://www.w3.org/2000/svg" width="720" height="104" viewBox="0 0 720 104">
  <defs>
    <linearGradient id="chassis_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1728" stop-opacity="0.98" />
      <stop offset="50%" stop-color="#060f1b" stop-opacity="0.99" />
      <stop offset="100%" stop-color="#040912" stop-opacity="1.0" />
    </linearGradient>
    <linearGradient id="chassis_top_border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.75" />
      <stop offset="15%" stop-color="#123b5c" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#1b4d75" stop-opacity="0.95" />
      <stop offset="85%" stop-color="#123b5c" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#00f5ff" stop-opacity="0.75" />
    </linearGradient>
  </defs>

  <!-- Cyber Chassis polygon with straight angled corner cuts on far left & far right, extending to y=104 -->
  <polygon points="24,2 696,2 720,28 720,104 0,104 0,28"
           fill="url(#chassis_grad)" />

  <!-- Top accent border line (straight chamfered corners) -->
  <polyline points="2,28 24,3 696,3 718,28"
            fill="none"
            stroke="url(#chassis_top_border)"
            stroke-width="2.5"
            stroke-linejoin="miter" />

  <!-- Corner cyber notches -->
  <path d="M 4 36 L 4 56" stroke="#00f5ff" stroke-width="2" stroke-linecap="square" stroke-opacity="0.75" />
  <path d="M 716 36 L 716 56" stroke="#00f5ff" stroke-width="2" stroke-linecap="square" stroke-opacity="0.75" />
</svg>
