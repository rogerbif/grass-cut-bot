<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 58 52" width="58" height="52">
  <defs>
    <!-- Gradiente escuro translúcido com brilho ciano suave (idêntico ao botão de settings) -->
    <linearGradient id="chip_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192e" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#0c203a" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#050e1b" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Borda neon ciano -->
    <linearGradient id="neon_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#0096c7"/>
    </linearGradient>

    <!-- Filtro de sombra e glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Forma chanfrada octogonal assimétrica idêntica ao settings -->
  <polygon points="12,3 46,3 55,14 55,38 46,49 12,49 3,38 3,14"
           fill="url(#chip_bg)"
           stroke="url(#neon_border)"
           stroke-width="2.5"
           stroke-linejoin="round"
           filter="url(#glow)"/>

  <!-- Duas barras verticais do ícone de Pausa em branco sólido com relevo -->
  <rect x="20" y="16" width="6" height="20" rx="2" fill="#ffffff" opacity="0.95"/>
  <rect x="32" y="16" width="6" height="20" rx="2" fill="#ffffff" opacity="0.95"/>
</svg>
