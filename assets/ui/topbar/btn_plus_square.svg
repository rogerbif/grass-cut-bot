<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <defs>
    <linearGradient id="plus_bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4e35ab" />
      <stop offset="40%" stop-color="#3d278f" />
      <stop offset="100%" stop-color="#24165e" />
    </linearGradient>
    <linearGradient id="plus_border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8a70f8" />
      <stop offset="100%" stop-color="#3b238f" />
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="1.5" y="1.5" width="33" height="33" rx="7" fill="url(#plus_bg)" stroke="url(#plus_border)" stroke-width="1.8" />

  <!-- Plus symbol in crisp white/light violet -->
  <path d="M 18 10 L 18 26 M 10 18 L 26 18" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
</svg>