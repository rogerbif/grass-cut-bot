<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 58 52" width="58" height="52">
  <defs>
    <!-- Gradiente escuro no modo pressionado -->
    <linearGradient id="chip_bg_p" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040b15" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#081526" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Borda neon ciano intenso -->
    <linearGradient id="neon_border_p" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#00f5d4"/>
    </linearGradient>
  </defs>

  <polygon points="12,3 46,3 55,14 55,38 46,49 12,49 3,38 3,14"
           fill="url(#chip_bg_p)"
           stroke="url(#neon_border_p)"
           stroke-width="2.5"
           stroke-linejoin="round"/>

  <!-- Duas barras deslocadas 2px para baixo com leve compressão táctil -->
  <rect x="20" y="18" width="6" height="20" rx="2" fill="#00f5d4" opacity="0.95"/>
  <rect x="32" y="18" width="6" height="20" rx="2" fill="#00f5d4" opacity="0.95"/>
</svg>
