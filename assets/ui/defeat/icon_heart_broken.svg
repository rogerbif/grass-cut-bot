<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="hb_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff5e6c"/>
      <stop offset="55%" stop-color="#f4364c"/>
      <stop offset="100%" stop-color="#c9182b"/>
    </linearGradient>
    <filter id="hb_shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#050b18" flood-opacity="0.75"/>
    </filter>
  </defs>
  <g filter="url(#hb_shadow)">
    <!-- Metade Esquerda do Coração Partido -->
    <path d="M 30 56 C 30 56 6 41 6 23 C 6 13.5 13.2 7 22 7 C 26.2 7 29.5 8.8 31.5 11.8 L 25.5 22 L 32.5 29.5 L 25.5 39.5 L 30 56 Z"
          fill="url(#hb_grad)"
          stroke="#101828"
          stroke-width="3.2"
          stroke-linejoin="round"/>
    <!-- Brilho Superior Esquerdo -->
    <path d="M 13 18 C 13 14 16.5 11.5 20.5 11.5"
          fill="none"
          stroke="#ffb3ba"
          stroke-width="2.6"
          stroke-linecap="round"
          opacity="0.75"/>

    <!-- Metade Direita do Coração Partido (levemente deslocada/inclinada) -->
    <path d="M 34 56 L 30.5 41 L 37.5 30.5 L 30.5 23 L 35.5 13 C 37.8 9.5 41.5 7.5 46 7.5 C 54.5 7.5 60 14 60 23.5 C 60 41.5 34 56 34 56 Z"
          fill="url(#hb_grad)"
          stroke="#101828"
          stroke-width="3.2"
          stroke-linejoin="round"/>
  </g>
</svg>
