<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 100" width="340" height="100">
  <defs>
    <!-- Gradiente Dourado Flamejante / Ouro Radiante -->
    <linearGradient id="gold_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e67e00"/>
      <stop offset="30%" stop-color="#ffb700"/>
      <stop offset="65%" stop-color="#ffe600"/>
      <stop offset="100%" stop-color="#ff9900"/>
    </linearGradient>

    <!-- Gradiente de Brilho Superior Dourado -->
    <linearGradient id="gold_shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#fff5cc" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Filtro de brilho estelar -->
    <filter id="star_glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Forma Preenchida Dourada -->
  <path d="M 42 23
           L 246 23
           L 262 17
           L 305 17
           L 322 34
           L 291 73
           L 42 73
           L 26 57
           Z"
        fill="url(#gold_grad)"/>

  <!-- Brilho superior -->
  <path d="M 42 23
           L 246 23
           L 262 17
           L 305 17
           L 314 26
           L 34 48
           L 26 57
           Z"
        fill="url(#gold_shine)"/>

  <!-- Estrelinhas e Faíscas Brilhantes Decorativas -->
  <g fill="#ffffff" filter="url(#star_glow)">
    <!-- Estrela 1 -->
    <polygon points="65,42 67,46 71,46 68,48 69,52 65,49 61,52 62,48 59,46 63,46" opacity="0.9"/>
    <!-- Estrela 2 -->
    <polygon points="105,34 106,37 109,37 107,39 108,42 105,40 102,42 103,39 101,37 104,37" opacity="0.75"/>
    <!-- Estrela 3 -->
    <polygon points="225,36 227,40 231,40 228,42 229,46 225,43 221,46 222,42 219,40 223,40" opacity="0.85"/>
    <!-- Estrela 4 -->
    <polygon points="275,50 276,53 279,53 277,55 278,58 275,56 272,58 273,55 271,53 274,53" opacity="0.75"/>
    <!-- Pontos de luz -->
    <circle cx="85" cy="56" r="1.5" opacity="0.8"/>
    <circle cx="150" cy="32" r="1.3" opacity="0.7"/>
    <circle cx="195" cy="58" r="1.4" opacity="0.75"/>
    <circle cx="255" cy="40" r="1.6" opacity="0.85"/>
  </g>
</svg>
