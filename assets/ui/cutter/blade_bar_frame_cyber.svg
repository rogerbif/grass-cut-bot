<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 100" width="340" height="100">
  <defs>
    <!-- Gradiente escuro de fundo com profundidade cyber -->
    <linearGradient id="bg_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091b33" stop-opacity="0.98"/>
      <stop offset="50%" stop-color="#0d264a" stop-opacity="0.97"/>
      <stop offset="100%" stop-color="#040d1c" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Gradiente da borda neon ciano / esmeralda -->
    <linearGradient id="border_neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="30%" stop-color="#00ffcc"/>
      <stop offset="70%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#00c8ff"/>
    </linearGradient>

    <!-- Filtro de brilho neon -->
    <filter id="neon_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- RISQUINHOS EXTERNOS (Tick marks cyber neon) -->
  <!-- Risquinho Superior Direito: linha horizontal acima do degrau + descida chanfrada -->
  <path d="M 230 11 L 305 11 L 324 30"
        fill="none"
        stroke="#00ffff"
        stroke-width="5"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.95"
        filter="url(#neon_glow)"/>

  <!-- Pequeno traço complementar à esquerda do risquinho superior -->
  <path d="M 205 11 L 220 11"
        fill="none"
        stroke="#00ffc4"
        stroke-width="4.5"
        stroke-linecap="round"
        opacity="0.85"/>

  <!-- Risquinho Inferior Esquerdo: linha horizontal sob a base + subida chanfrada -->
  <path d="M 115 89 L 36 89 L 16 69"
        fill="none"
        stroke="#00ffff"
        stroke-width="5"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.95"
        filter="url(#neon_glow)"/>

  <!-- Pequeno traço complementar à direita do risquinho inferior -->
  <path d="M 125 89 L 140 89"
        fill="none"
        stroke="#00ffc4"
        stroke-width="4.5"
        stroke-linecap="round"
        opacity="0.85"/>

  <!-- SOMBRA DA PLACA -->
  <path d="M 40 22 L 250 22 L 266 16 L 310 16 L 328 34 L 296 78 L 40 78 L 22 60 Z"
        fill="#000000"
        opacity="0.5"/>

  <!-- CORPO PRINCIPAL DO FRAME (Fundo escuro cyber) -->
  <path d="M 40 20
           L 248 20
           L 264 14
           L 308 14
           L 326 32
           L 294 76
           L 40 76
           L 22 58
           Z"
        fill="url(#bg_grad)"
        stroke="url(#border_neon)"
        stroke-width="3.5"
        stroke-linejoin="round"/>

  <!-- Calha interna escura para o preenchimento de progresso -->
  <path d="M 42 23
           L 246 23
           L 262 17
           L 305 17
           L 322 34
           L 291 73
           L 42 73
           L 26 57
           Z"
        fill="#030814"
        opacity="0.9"/>

  <!-- Brilho interno do contorno superior -->
  <path d="M 40 22 L 248 22 L 264 16 L 306 16"
        fill="none"
        stroke="#ffffff"
        stroke-width="1.8"
        opacity="0.45"/>
</svg>
