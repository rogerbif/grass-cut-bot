<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 2048" width="2048" height="2048">
  <defs>
    <style>
      .glow-shape { fill: #FFFFFF; }
      .stroke-shape { stroke: #FFFFFF; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Grade 2 colunas x 6 linhas (2048 x 2048) -->
  <!-- Cada célula: Largura = 1024px, Altura = 341.33px (Aspect Ratio 3.00:1) -->
  <!-- Olho esquerdo centro: X=232, Y=171 | Olho direito centro: X=792, Y=171 | Raio base: 112px -->

  <!-- ============================================================== -->
  <!-- LINHA 0: Y = 0..341.33                                         -->
  <!-- ============================================================== -->

  <!-- 0: NORMAL - Coluna 0 (X: 0..1024) -->
  <g id="frame_0_normal">
    <circle cx="232" cy="171" r="112" class="glow-shape" />
    <circle cx="792" cy="171" r="112" class="glow-shape" />
  </g>

  <!-- 1: HAPPY - Coluna 1 (X: 1024..2048) -> cx_esq = 1256, cx_dir = 1816 -->
  <g id="frame_1_happy">
    <path d="M 1154 220 Q 1256 70 1358 220" class="stroke-shape" stroke-width="48" />
    <path d="M 1714 220 Q 1816 70 1918 220" class="stroke-shape" stroke-width="48" />
  </g>

  <!-- ============================================================== -->
  <!-- LINHA 1: Y = 341.33..682.66 (Y_center = 512)                   -->
  <!-- ============================================================== -->

  <!-- 2: SAD - Coluna 0 (X: 0..1024) -->
  <g id="frame_2_sad">
    <!-- Olho Esquerdo: Semicírculo voltado para baixo com pálpebra caída -->
    <path d="M 120 490 C 120 600 344 600 344 490 Z" class="glow-shape" />
    <path d="M 104 460 L 360 500" class="stroke-shape" stroke-width="26" />
    <!-- Olho Direito -->
    <path d="M 680 490 C 680 600 904 600 904 490 Z" class="glow-shape" />
    <path d="M 664 500 L 920 460" class="stroke-shape" stroke-width="26" />
  </g>

  <!-- 3: ANGRY - Coluna 1 (X: 1024..2048) -->
  <g id="frame_3_angry">
    <!-- Olho Esquerdo agressivo inclinado para dentro -->
    <polygon points="1134,440 1358,500 1320,600 1134,600" class="glow-shape" />
    <!-- Olho Direito agressivo inclinado para dentro -->
    <polygon points="1714,500 1938,440 1938,600 1752,600" class="glow-shape" />
  </g>

  <!-- ============================================================== -->
  <!-- LINHA 2: Y = 682.66..1024 (Y_center = 853)                     -->
  <!-- ============================================================== -->

  <!-- 4: ALERT - Coluna 0 (X: 0..1024) -->
  <g id="frame_4_alert">
    <circle cx="232" cy="853" r="102" class="stroke-shape" stroke-width="42" />
    <circle cx="792" cy="853" r="102" class="stroke-shape" stroke-width="42" />
  </g>

  <!-- 5: SLEEPING - Coluna 1 (X: 1024..2048) -->
  <g id="frame_5_sleeping">
    <line x1="1134" y1="853" x2="1378" y2="853" class="stroke-shape" stroke-width="48" />
    <line x1="1694" y1="853" x2="1938" y2="853" class="stroke-shape" stroke-width="48" />
  </g>

  <!-- ============================================================== -->
  <!-- LINHA 3: Y = 1024..1365.33 (Y_center = 1195)                   -->
  <!-- ============================================================== -->

  <!-- 6: GLITCH - Coluna 0 (X: 0..1024) -->
  <g id="frame_6_glitch">
    <!-- Ponto de Interrogação '?' -->
    <path d="M 180 1120 C 180 1060 284 1060 284 1130 C 284 1180 232 1195 232 1245" class="stroke-shape" stroke-width="40" />
    <circle cx="232" cy="1290" r="20" class="glow-shape" />
    <!-- Espiral '@' -->
    <path d="M 830 1195 A 90 90 0 1 0 830 1200 A 55 55 0 1 0 830 1190" class="stroke-shape" stroke-width="32" />
  </g>

  <!-- 7: WINK - Coluna 1 (X: 1024..2048) -->
  <g id="frame_7_wink">
    <circle cx="1256" cy="1195" r="112" class="glow-shape" />
    <line x1="1694" y1="1195" x2="1938" y2="1195" class="stroke-shape" stroke-width="48" />
  </g>

  <!-- ============================================================== -->
  <!-- LINHA 4: Y = 1365.33..1706.66 (Y_center = 1536)                 -->
  <!-- ============================================================== -->

  <!-- 8: VICTORY - Coluna 0 (X: 0..1024) -->
  <g id="frame_8_victory">
    <!-- Estrela ★ de 5 pontas centrada em (232, 1536) com raio ext 120, int 56 -->
    <polygon points="
      232,1416 267,1502 355,1502 284,1555 311,1641 
      232,1588 153,1641 180,1555 109,1502 197,1502" 
      class="glow-shape" />
    <!-- Coração ♥ centrado em (792, 1536) -->
    <path d="
      M 792 1630 
      C 684 1536 676 1438 734 1418 
      C 780 1398 792 1458 792 1458 
      C 792 1458 804 1398 850 1418 
      C 908 1438 900 1536 792 1630 Z" 
      class="glow-shape" />
  </g>

  <!-- 9: OFF - Coluna 1 (X: 1024..2048) -> Vazio -->
  <g id="frame_9_off">
  </g>

</svg>
