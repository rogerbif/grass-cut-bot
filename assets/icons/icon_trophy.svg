<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Gradiente de Ouro Reluzente -->
    <linearGradient id="trophy_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff066"/>
      <stop offset="45%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#fb8500"/>
    </linearGradient>

    <filter id="trophy_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Taça / Cálice -->
  <path d="M 18 10 L 46 10 L 46 26 C 46 36 38 42 32 42 C 26 42 18 36 18 26 Z"
        fill="url(#trophy_gold)"
        stroke="#ffffff"
        stroke-width="1.8"
        stroke-linejoin="round"
        filter="url(#trophy_glow)"/>

  <!-- Alça Esquerda -->
  <path d="M 18 14 C 10 14 10 26 18 28"
        fill="none"
        stroke="url(#trophy_gold)"
        stroke-width="4.0"
        stroke-linecap="round"/>

  <!-- Alça Direita -->
  <path d="M 46 14 C 54 14 54 26 46 28"
        fill="none"
        stroke="url(#trophy_gold)"
        stroke-width="4.0"
        stroke-linecap="round"/>

  <!-- Haste do Troféu -->
  <rect x="29" y="42" width="6" height="8" rx="1" fill="#fb8500"/>

  <!-- Base do Troféu -->
  <polygon points="20,58 44,58 40,50 24,50" fill="url(#trophy_gold)" stroke="#ffffff" stroke-width="1.2"/>
  <rect x="18" y="57" width="28" height="4" rx="2" fill="#d47000"/>
</svg>
