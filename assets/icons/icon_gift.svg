<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#33D6FF"/>
      <stop offset="100%" stop-color="#0E5A8A"/>
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE45E"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <!-- Box body -->
  <rect x="10" y="26" width="44" height="30" rx="6" fill="url(#boxGrad)" stroke="#07192B" stroke-width="3"/>
  <!-- Lid -->
  <rect x="6" y="18" width="52" height="12" rx="4" fill="url(#boxGrad)" stroke="#07192B" stroke-width="3"/>
  <!-- Vertical ribbon -->
  <rect x="27" y="18" width="10" height="38" fill="url(#ribbonGrad)" stroke="#07192B" stroke-width="2.5"/>
  <!-- Bow left -->
  <path d="M32 18 C24 8, 12 10, 18 18 Z" fill="url(#ribbonGrad)" stroke="#07192B" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Bow right -->
  <path d="M32 18 C40 8, 52 10, 46 18 Z" fill="url(#ribbonGrad)" stroke="#07192B" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Center knot -->
  <circle cx="32" cy="18" r="4.5" fill="#FFF3B0" stroke="#07192B" stroke-width="2.5"/>
</svg>
