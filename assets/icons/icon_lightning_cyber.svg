<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bolt_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff9a6"/>
      <stop offset="45%" stop-color="#ffbe0b"/>
      <stop offset="100%" stop-color="#fb5607"/>
    </linearGradient>
    <filter id="bolt_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#ffbe0b" flood-opacity="0.6"/>
    </filter>
  </defs>
  <g filter="url(#bolt_glow)">
    <!-- Raio Elétrico Chanfrado Cyber -->
    <polygon points="27,4 13,24 23,24 19,44 35,22 25,22"
             fill="url(#bolt_grad)"
             stroke="#ffe66d"
             stroke-width="1.5"
             stroke-linejoin="round"/>
  </g>
</svg>
