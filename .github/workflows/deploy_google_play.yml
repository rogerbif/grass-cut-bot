name: Deploy to Google Play

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Faixa de distribuição do Google Play (internal, alpha, beta, production)'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      release_notes_pt:
        description: 'Notas da versão (pt-BR) - opcional'
        required: false
        type: string
        default: ''
      release_notes_en:
        description: 'Release Notes (en-US) - optional'
        required: false
        type: string
        default: ''

  push:
    tags:
      - 'v*'

jobs:
  build-and-deploy:
    name: Build AAB & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Build Tools & Platforms Android
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true

      - name: Instalar Godot 4.7.2 Headless & Export Templates
        run: |
          GODOT_VERSION="4.7.2-stable"
          
          # Baixa o executável do Godot para Linux
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          rm Godot_v${GODOT_VERSION}_linux.x86_64.zip

          # Baixa e configura os Export Templates
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          unzip -q Godot_v${GODOT_VERSION}_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/4.7.2.stable/
          rm -rf templates Godot_v${GODOT_VERSION}_export_templates.tpz

          godot --version

      - name: Restaurar Keystore de Assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 não configurada no repositório!"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks

      - name: Restaurar Chave da Google Play Service Account
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Secret PLAY_SERVICE_ACCOUNT_JSON não configurada no repositório!"
            exit 1
          fi
          echo "$SERVICE_ACCOUNT_JSON" > play_service_account.json

      - name: Instalar Android Build Template e Ajustar Gradle
        run: |
          godot --headless --install-android-build-template || true
          mkdir -p android/build
          if [ -f android/build/gradle.properties ]; then
            echo "android.suppressUnsupportedCompileSdk=36" >> android/build/gradle.properties
          fi

      - name: Compilar Android App Bundle (.aab)
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/upload-keystore.jks
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.KEYSTORE_USER || 'grasscutbot' }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'grasscutbot2026' }}
        run: |
          mkdir -p build/release
          godot --headless --export-release grasscutbot build/release/grass_cut_bot.aab

          if [ ! -f "build/release/grass_cut_bot.aab" ]; then
            echo "::error::Falha na exportação do arquivo AAB!"
            exit 1
          fi
          ls -lh build/release/grass_cut_bot.aab

      - name: Salvar Artefato do AAB no GitHub
        uses: actions/upload-artifact@v4
        with:
          name: grass-cut-bot-release-aab
          path: build/release/grass_cut_bot.aab
          retention-days: 14

      - name: Configurar Node.js e Publicar no Google Play
        env:
          RELEASE_NOTES_PT: ${{ github.event.inputs.release_notes_pt }}
          RELEASE_NOTES_EN: ${{ github.event.inputs.release_notes_en }}
        run: |
          cd scripts/tools/play_store_uploader
          npm ci
          
          TRACK="${{ github.event.inputs.track }}"
          if [ -z "$TRACK" ]; then
            TRACK="internal"
          fi
          
          echo ">>> DISPARANDO UPLOAD PARA A FAIXA: $TRACK <<<"
          node upload.js --track="$TRACK" --aab="../../build/release/grass_cut_bot.aab" --key="../../play_service_account.json"
